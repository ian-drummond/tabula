ex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.pwb button{border:0;border-radius:0;padding:.3em .55em}.pwb button.on{background:var(--soft)}
.brand{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px;margin:2px 4px 12px}

.nav a{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:8px;color:var(--ink);margin:1px 0}
.nav a:hover{background:var(--soft)}

.nav a .n{margin-left:auto;color:var(--mute);font-size:.82em;font-weight:400}

.sidehint{font-size:.8rem;color:var(--mute);padding:2px 8px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

.seg button.on{background:var(--soft);font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.pillsel{border-radius:999px;padding:.3em .8em;background:var(--bg);color:var(--mute);appearance:auto}
.pillsel.on{border-color:var(--acc);color:var(--acc);background:var(--accbg)}
.quick{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:5px 8px;margin:10px 0 12px;background:var(--bg)}

.quick button.pri{padding:.35em 1em}

.tile .em{font-size:1.25rem}
.tile b{font-weight:600}
.tile .num{margin-left:auto;font-size:1.15rem;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.panel{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--tile);margin:10px 0;box-shadow:var(--shadow)}
.panel h2{font-size:1rem;margin:0 0 6px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel h2 .c{color:var(--mute);font-weight:400;font-size:.9em}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.mute{color:var(--mute);font-size:.88em}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 .6em;font-size:.82em;margin:2px 3px 2px 0;cursor:pointer;white-space:nowrap;line-height:1.7;color:var(--ink)}
.chip.mu{color:var(--mute)}
.chip.fl{background:color-mix(in srgb,var(--orange) 14%,transparent);border-color:transparent;color:var(--orange)}
.chip i.av{width:16px;height:16px;border-radius:50%;color:#fff;font-size:.62rem;font-style:normal;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.chip.src{text-decoration:underline}
.chip.car{background:var(--soft)}
.it{position:relative;display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .chk{flex:none;width:19px;height:19px;border:1.6px solid var(--mute);border-radius:50%;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff}
.it .chk:hover{border-color:var(--acc)}
.it.done .chk{background:var(--ok);border-color:var(--ok)}
.it.dropped .chk{background:var(--mute);border-color:var(--mute)}
.it .gl{flex:none;width:19px;text-align:center;color:var(--mute);margin-top:1px;cursor:pointer}
.it .mid{flex:1;min-width:0}

/* ===== Components (docs/DESIGN.md). Tokens only. ===== */
:root{--scrim:rgba(0,0,0,.32);--bw:0px}
:root[data-surface=paper],:root[data-surface=crisp]{--bw:1px}
body{font:var(--t-body)/1.5 var(--font-ui);background:var(--surface);color:var(--ink);-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* buttons: primary, secondary, plain, destructive */
button{background:var(--fill);border:0;box-shadow:inset 0 0 0 var(--bw) var(--edge);border-radius:var(--r2);padding:5px 12px;font-weight:500;line-height:1.35;color:var(--ink)}
button:hover{background:color-mix(in srgb,var(--ink) 13%,transparent)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--accent);color:var(--on-accent);box-shadow:none;font-weight:600}
button.pri:hover{background:var(--accent);filter:brightness(1.08)}
button.warn{background:none;box-shadow:none;color:var(--red)}
button.warn:hover{background:color-mix(in srgb,var(--red) 10%,transparent)}
button.lnk{background:none;box-shadow:none;color:var(--accent);padding:0 4px}
button.lnk:hover{background:none;opacity:.75}
/* fields */
input,select,textarea{background:var(--surface);border:1px solid var(--edge);border-radius:var(--r2);padding:5px 9px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
/* segmented controls */
.seg,.pwb{display:inline-flex;gap:2px;background:var(--fill);border:0;border-radius:var(--r2);padding:2px;overflow:visible}
.seg button,.pwb button,.seg a{background:none;border:0;box-shadow:none;border-radius:calc(var(--r2) - 2px);padding:3px 11px;font-weight:500;color:var(--ink)}
.seg button+button{border-left:0}
.seg button:hover,.pwb button:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.seg button.on,.pwb button.on,.seg a.on{background:var(--surface);box-shadow:0 1px 2px var(--shade2),inset 0 0 0 var(--bw) var(--edge);font-weight:600}
/* chips and pills */
.chip,.exp .ch,.kev,.etb{background:var(--fill2);border:0;box-shadow:inset 0 0 0 var(--bw) var(--edge);border-radius:var(--r1);color:var(--ink)}
.chip{padding:0 8px;font-size:12.5px;line-height:1.75}
.pill{font:500 12px/1.6 var(--font-ui);background:var(--accent-bg);color:var(--accent);border-radius:var(--r1);padding:1px 8px}
.exp .qb button,.ptsel button,.cap-pills button,.strip .sg,.pillsel{border-radius:var(--r1);background:var(--fill2);border:0;box-shadow:inset 0 0 0 var(--bw) var(--edge);color:var(--ink)}
.exp .qb button.on,.ptsel button.on,.cap-pills button.on,.pillsel.on{background:var(--accent-bg);color:var(--accent);box-shadow:none}
.exp input.add{border-radius:var(--r1)}
/* panels and cards: plain surfaces, color only as a small dot */
.panel,.ctlp,.ecard,.ymc,.nrow,.pcard,.msb,.tile{background:var(--surface);border:1px solid var(--sep);border-radius:var(--r3);box-shadow:var(--sh1)}
.panel{padding:14px 16px}
.panel h2{font-size:var(--t-body);font-weight:600}
.panel.tint{background:var(--surface);border-color:var(--sep)}
.panel.tint>h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc);flex:none}
.tile{background:var(--surface2);border-color:transparent;box-shadow:none}
.tile.hot{border-left:0}.tile.hot .num{color:var(--orange)}
.ecard:hover,.pcard:hover{border-color:var(--sep);background:var(--surface2)}
.ymc.now{border-color:var(--accent);background:var(--accent-bg)}
.col{background:var(--surface2);border-radius:var(--r3)}
.col .it{background:var(--surface);border:1px solid var(--sep);border-radius:var(--r2)}
.dpok{background:var(--surface2);border-radius:var(--r3)}
/* labels: sentence case, no tracking */
.gh,.sub,.exp .xt,.exp>label,.mg.mgh,.pickmenu .hd,.ctll,.md span,.mgd span{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600}
.gh,.pickmenu .hd,.ctll{color:var(--ink3)}
.sub,.exp .xt{color:var(--ink2)}
.sub.now{color:var(--accent)}
.mute{color:var(--ink2);font-size:var(--t-small)}
/* sidebar */
#side{background:var(--sidebar);border-right:1px solid var(--sep)}
.nav a{padding:5px 9px;border-radius:var(--r2);color:var(--ink)}
.nav a:hover{background:var(--fill2)}
.nav a.on{background:var(--fill);color:var(--ink);font-weight:600}
.nav a .n{color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
.brand{font-weight:600}
/* toolbar */
#top{background:var(--surface)}
#top h1{font:700 var(--t-title)/1.2 var(--font-title);letter-spacing:-.01em}
#top .hnav{background:var(--fill2)}
#top .hnav button{box-shadow:none}
#top .hnav button:hover{background:var(--surface);box-shadow:var(--sh1)}
#top .tbi{width:30px;height:30px;padding:0;display:inline-grid;place-items:center;background:none;box-shadow:none;color:var(--ink2)}
#top .tbi:hover{background:var(--fill2);color:var(--ink)}
#top .tbi svg{width:17px;height:17px}
